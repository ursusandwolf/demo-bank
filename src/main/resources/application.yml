spring:
  application:
    name: bank
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bank?options=-c%20timezone=Europe/Kyiv}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:default}

server:
  port: 8080
  error:
    include-message: never

jwt:
  secret: ${JWT_SECRET}

security:
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
    window-seconds: ${LOGIN_WINDOW_SECONDS:60}
    max-clients: ${LOGIN_MAX_CLIENTS:10000}
